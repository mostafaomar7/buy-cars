<form class="form" [formGroup]="form" (ngSubmit)="submit()">
  <div class="form__grid">
    <label class="field">
      <span>الاسم الكامل</span>
      <input class="input" formControlName="fullName" />
      @if (form.controls.fullName.touched && form.controls.fullName.invalid) {
        <small class="field__error">الاسم مطلوب</small>
      }
    </label>

    <label class="field">
      <span>البريد الإلكتروني</span>
      <input class="input" type="email" dir="ltr" formControlName="email" />
      @if (form.controls.email.touched && form.controls.email.invalid) {
        <small class="field__error">أدخل بريدًا صحيحًا</small>
      }
    </label>

    <label class="field">
      <span>رقم الهوية</span>
      <input class="input mono" inputmode="numeric" formControlName="nationalId" />
      @if (form.controls.nationalId.touched && form.controls.nationalId.invalid) {
        <small class="field__error">رقم الهوية مطلوب</small>
      }
    </label>

    <label class="field">
      <span>الجوال</span>
      <input class="input mono" type="tel" dir="ltr" formControlName="phone" placeholder="05xxxxxxxx" />
    </label>

    <label class="field">
      <span>تاريخ الميلاد</span>
      <input class="input" type="date" formControlName="dateOfBirth" />
    </label>

    <label class="field">
      <span>الجنسية</span>
      <input class="input" formControlName="nationality" />
    </label>

    <label class="field">
      <span>الجنس</span>
      <select class="input" formControlName="gender">
        <option value="">—</option>
        @for (option of genders; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>الحالة الاجتماعية</span>
      <select class="input" formControlName="maritalStatus">
        <option value="">—</option>
        @for (option of maritalStatuses; track option.value) {
          <option [value]="option.value">{{ option.label }}</option>
        }
      </select>
    </label>

    <label class="field">
      <span>المستوى التعليمي</span>
      <input class="input" formControlName="educationLevel" />
    </label>
  </div>

  @if (error(); as error) {
    <div class="alert alert--error">{{ error }}</div>
  }

  <div class="form__actions">
    <button type="submit" class="btn btn--primary" [disabled]="saving()">
      {{ saving() ? 'جارٍ الحفظ...' : 'حفظ التغييرات' }}
    </button>
    <button type="button" class="btn btn--ghost" (click)="cancelled.emit()">إلغاء</button>
  </div>
</form>
